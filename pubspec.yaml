name: aptos
description: Aptos Dart SDK — a pure-Dart client library for the Aptos blockchain.
version: 1.0.0
repository: https://github.com/0xmove/aptos

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  dio: ^5.4.0
  # Security-critical cryptography dependencies are pinned to exact versions
  # for reproducibility and auditability. The BIP-39 mnemonic-to-seed routine
  # is implemented inline (see lib/src/core/crypto/hd_key.dart) so the package
  # no longer needs the `bip39` package, which pins pointycastle to 3.x.
  ed25519_edwards: 0.3.1
  pointycastle: 4.0.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
